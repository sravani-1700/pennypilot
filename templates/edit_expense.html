
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense | PennyPilot</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5edff, #e7faf3, #fff0e8);
            color: #39334a;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            background: rgba(255,255,255,.94);
            border: 1px solid #eee6f7;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(86, 65, 116, .12);
        }

        .brand { color: #8766c4; font-weight: bold; }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #777084; margin-bottom: 26px; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ded6eb;
            border-radius: 12px;
            font: inherit;
            background: #fff;
        }

        input:focus, textarea:focus {
            outline: 2px solid #c9b5f0;
            border-color: #987bd0;
        }

        textarea { resize: vertical; }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button, .cancel {
            flex: 1;
            border: 0;
            border-radius: 12px;
            padding: 13px;
            text-align: center;
            font: inherit;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            color: white;
            background: #8968c7;
        }

        button:hover { background: #7452b4; }

        .cancel {
            background: #f0ebf7;
            color: #594b70;
        }

        .flash {
            padding: 12px;
            border-radius: 10px;
            background: #fff0f0;
            color: #a33b4a;
            margin: 12px 0;
        }

        @media (max-width: 420px) {
            .card { padding: 22px; }
            .buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">✿ PennyPilot</div>
        <h1>Edit expense</h1>
        <p class="subtitle">Correct your details and save your changes.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="amount">Amount (₹)</label>
            <input
                id="amount"
                name="amount"
                type="number"
                min="0.01"
                max="9999999999.99"
                step="0.01"
                value="{{ item.amount }}"
                required
            >

            <label for="category">Category</label>
            <input
                id="category"
                name="category"
                type="text"
                maxlength="50"
                value="{{ item.category }}"
                required
            >

            <label for="transaction_date">Date</label>
            <input
                id="transaction_date"
                name="transaction_date"
                type="date"
                value="{{ item.transaction_date.isoformat() }}"
                required
            >

            <label for="note">Note (optional)</label>
            <textarea
                id="note"
                name="note"
                maxlength="200"
                rows="3"
            >{{ item.note or "" }}</textarea>

            <div class="buttons">
                <a class="cancel" href="{{ url_for('dashboard', month=item.transaction_date.month, year=item.transaction_date.year) }}">Cancel</a>
                <button type="submit">Save changes</button>
            </div>
        </form>
    </main>
</body>
</html>
