
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PennyPilot</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f3eaff, #e5fff3, #fff0e8);
            color: #493b60;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 12px 35px #8d7aaa25;
        }

        h1 { text-align: center; color: #9274c8; }
        p { text-align: center; line-height: 1.6; }
        label { display: block; margin-top: 16px; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #dfd4ef;
            border-radius: 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #9274c8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        a { color: #8060b5; }
        .message { padding: 10px; border-radius: 10px; background: #fff0f0; }
    </style>
</head>
<body>
    <main class="card">
        <h1>🌷 Join PennyPilot</h1>
        <p>Create your own little money space.</p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
            <p class="message">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   maxlength="40" required autocomplete="username">

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   maxlength="120" required autocomplete="email">

            <label for="password">Password (at least 8 characters)</label>
            <input id="password" name="password" type="password"
                   minlength="8" required autocomplete="new-password">

            <button type="submit">Create my account 💜</button>
        </form>

        <p>Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
        <p><a href="{{ url_for('home') }}">← Back home</a></p>
    </main>
</body>
</html>
